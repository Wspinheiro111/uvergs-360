version: "3.9"

# UVERGS 360 — Ambiente de desenvolvimento local
# W9 Sistemas · v4.2 baseline
#
# Uso:
#   docker compose up -d
#   docker compose down -v  (apaga volumes)
#
# Serviços:
#   postgres → localhost:5432
#   redis    → localhost:6379
#   minio    → localhost:9000 (API) / 9001 (Console)

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — banco principal
  # Configurado com extensions necessárias para o UVERGS 360
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uvergs360_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uvergs360_dev
      POSTGRES_USER: uvergs360
      POSTGRES_PASSWORD: uvergs360_dev_secret
      # Roles criados via init script:
      # - app_user: role da aplicação (RLS ativado, sem bypass)
      # - service_role: role do worker/migrations (RLS bypass)
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uvergs360 -d uvergs360_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      postgres
        -c log_statement=all
        -c log_min_duration_statement=100
        -c shared_preload_libraries=pg_stat_statements
        -c max_connections=200
        -c work_mem=16MB

  # ---------------------------------------------------------------------------
  # PostgreSQL de teste — isolado para rodar testes sem afetar dev
  # ---------------------------------------------------------------------------
  postgres_test:
    image: pgvector/pgvector:pg16
    container_name: uvergs360_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: uvergs360_test
      POSTGRES_USER: uvergs360
      POSTGRES_PASSWORD: uvergs360_test_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uvergs360 -d uvergs360_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    tmpfs:
      - /var/lib/postgresql/data  # banco de teste em memória é mais rápido

  # ---------------------------------------------------------------------------
  # Redis 7 — filas (BullMQ), sessões, rate limiting, cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: uvergs360_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --requirepass uvergs360_redis_secret
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "uvergs360_redis_secret", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # MinIO — object storage S3-compatible
  # Produção: Cloudflare R2 ou AWS S3
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: uvergs360_minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: uvergs360_minio
      MINIO_ROOT_PASSWORD: uvergs360_minio_secret
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO setup — cria buckets necessários na inicialização
  # ---------------------------------------------------------------------------
  minio_setup:
    image: minio/mc:latest
    container_name: uvergs360_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 uvergs360_minio uvergs360_minio_secret;
        mc mb -p local/uvergs360-private;
        mc mb -p local/uvergs360-public;
        mc anonymous set download local/uvergs360-public;
        echo 'MinIO buckets criados.';
        exit 0;
      "
    restart: "no"

volumes:
  postgres_data:
    name: uvergs360_postgres_data
  postgres_test_data:
    name: uvergs360_postgres_test_data
  redis_data:
    name: uvergs360_redis_data
  minio_data:
    name: uvergs360_minio_data

networks:
  default:
    name: uvergs360_network
