name: CI — UVERGS 360

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ---------------------------------------------------------------------------
  # QUALIDADE DE CÓDIGO
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # SCAN DE SEGREDOS — bloqueia se segredo detectado no código
  # CRÍTICO: falha o CI se qualquer segredo for encontrado
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para gitleaks

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  # ---------------------------------------------------------------------------
  # DEPENDÊNCIAS VULNERÁVEIS
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # TESTES DE BANCO E MIGRATIONS
  # ---------------------------------------------------------------------------
  database:
    name: Database & Migrations
    runs-on: ubuntu-latest
    needs: [quality]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: uvergs360_test
          POSTGRES_USER: uvergs360
          POSTGRES_PASSWORD: uvergs360_test_secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://uvergs360:uvergs360_test_secret@localhost:5433/uvergs360_test
      DATABASE_URL: postgresql://uvergs360:uvergs360_test_secret@localhost:5433/uvergs360_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Aplicar init scripts (roles, extensions)
        run: |
          PGPASSWORD=uvergs360_test_secret psql \
            -h localhost -p 5433 -U uvergs360 -d uvergs360_test \
            -f packages/db/init/00_roles_and_extensions.sql

      - name: Aplicar migrations (do zero)
        run: pnpm db:migrate
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://uvergs360:uvergs360_test_secret@localhost:5433/uvergs360_test

      - name: Verificar idempotência (re-aplicar migrations)
        run: pnpm db:migrate
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://uvergs360:uvergs360_test_secret@localhost:5433/uvergs360_test

  # ---------------------------------------------------------------------------
  # TESTES DE ISOLAMENTO (obrigatórios no CI — §19.3 v4.2)
  # Cobre Cenários F, K, Q antes de qualquer push para main
  # ---------------------------------------------------------------------------
  isolation-tests:
    name: Isolation Tests (L1 · L2 · L3)
    runs-on: ubuntu-latest
    needs: [database]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: uvergs360_test
          POSTGRES_USER: uvergs360
          POSTGRES_PASSWORD: uvergs360_test_secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL_TEST: postgresql://uvergs360:uvergs360_test_secret@localhost:5433/uvergs360_test
      DATABASE_URL: postgresql://uvergs360:uvergs360_test_secret@localhost:5433/uvergs360_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup banco de teste
        run: |
          PGPASSWORD=uvergs360_test_secret psql \
            -h localhost -p 5433 -U uvergs360 -d uvergs360_test \
            -f packages/db/init/00_roles_and_extensions.sql
          pnpm db:migrate
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://uvergs360:uvergs360_test_secret@localhost:5433/uvergs360_test

      - name: Executar testes de isolamento (Nível 1 — Tenant)
        run: pnpm vitest run tests/isolation/rls-isolation.test.ts --reporter=verbose

      - name: Upload relatório de isolamento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-test-results
          path: coverage/

  # ---------------------------------------------------------------------------
  # TESTES UNITÁRIOS (domínio puro — regras de negócio)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [quality]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Executar testes unitários
        run: pnpm vitest run --reporter=verbose

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/

  # ---------------------------------------------------------------------------
  # VERIFICAÇÃO DE TODOs CRÍTICOS
  # Bloqueia se houver TODO crítico sem issue vinculada
  # ---------------------------------------------------------------------------
  todo-check:
    name: No Critical TODOs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for critical TODOs
        run: |
          # TODO crítico = TODO sem número de issue vinculado
          # Formatos aceitos: TODO(#123), TODO: ver #123, FIXME(#456)
          # Formatos bloqueados: TODO, FIXME, HACK, XXX sozinhos
          if grep -r --include="*.ts" --include="*.tsx" --include="*.sql" \
            -E "(TODO|FIXME|HACK|XXX):?\s+[^(#]" \
            --exclude-dir="node_modules" \
            --exclude-dir=".next" \
            .; then
            echo "❌ TODOs críticos encontrados sem issue vinculada!"
            echo "Formato correto: TODO(#123): descrição"
            exit 1
          fi
          echo "✅ Nenhum TODO crítico sem issue vinculada."

  # ---------------------------------------------------------------------------
  # DEPLOY EM STAGING (apenas na branch develop, após todos os checks)
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [quality, secret-scan, dependency-audit, isolation-tests, unit-tests, todo-check]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    environment:
      name: staging
      url: https://uvergs360-staging.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy para Vercel (staging)
        run: |
          pnpm dlx vercel --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --yes \
            apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STAGING }}

      - name: Smoke test pós-deploy
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://uvergs360-staging.vercel.app/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Smoke test falhou! Status: $STATUS"
            exit 1
          fi
          echo "✅ Smoke test passou (HTTP $STATUS)"
